<section id="contact" class="section">
    <div class="container contact-container">
        <div class="contact-form-wrapper">
            <h2>Let's work together!</h2>
            <p>I design and code beautifully simple things and I love what I do. Just simple like that!</p>
            <form class="contact-form">
                <div class="form-row">
                    <input type="text" placeholder="First name" class="form-control">
                    <input type="text" placeholder="Last name" class="form-control">
                </div>
                <div class="form-row">
                    <input type="email" placeholder="Email address" class="form-control">
                    <input type="text" placeholder="Phone number" class="form-control">
                </div>
                <select class="form-control">
                    <option>—Please choose an option—</option>
                    <option>UI/UX Design</option>
                    <option>Web Development</option>
                    <option>Frontend Ops</option>
                </select>
                <textarea placeholder="Message" rows="5" class="form-control"></textarea>
                <button type="button" class="btn btn-primary submit-btn">Send Message</button>
            </form>
        </div>
        <div class="contact-info">
            <div class="info-item">
                <div class="icon"><i class="fa-solid fa-phone"></i></div>
                <div class="details">
                    <span>Phone</span>
                    <p>+91 98765 43210</p>
                </div>
            </div>
            <div class="info-item">
                <div class="icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="details">
                    <span>Email</span>
                    <p>hello@akshaisanthosh.com</p>
                </div>
            </div>
            <div class="info-item">
                <div class="icon"><i class="fa-solid fa-location-dot"></i></div>
                <div class="details">
                    <span>Address</span>
                    <p>Perumbavoor, Kerala</p>
                </div>
            </div>
        </div>
    </div>
</section>
