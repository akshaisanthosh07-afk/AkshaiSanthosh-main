<app-header></app-header><main><router-outlet></router-outlet></main><app-footer></app-footer>

<!-- Scroll to Top Button -->
<button class="scroll-to-top" [class.visible]="showScrollToTop" (click)="scrollToTop()" aria-label="Scroll to Top">
    <i class="fa-solid fa-arrow-up"></i>
</button>


<!-- Mobile Bottom Navigation -->
<nav class="bottom-nav">
    <a [routerLink]="['/']" fragment="about" class="bottom-nav-item">
        <div class="nav-icon-wrapper">
            <i class="fa-solid fa-user"></i>
        </div>
        <span>About</span>
    </a>
    <a [routerLink]="['/']" fragment="education" class="bottom-nav-item">
        <div class="nav-icon-wrapper">
            <i class="fa-solid fa-user-graduate"></i>
        </div>
        <span>Edu</span>
    </a>
    <a [routerLink]="['/']" fragment="works" class="bottom-nav-item">
        <div class="nav-icon-wrapper main-nav-btn">
            <i class="fa-solid fa-laptop"></i>
        </div>
        <span>Works</span>
    </a>
    <a [routerLink]="['/']" fragment="experience" class="bottom-nav-item">
        <div class="nav-icon-wrapper">
            <i class="fa-solid fa-briefcase"></i>
        </div>
        <span>Exp</span>
    </a>
    <a [routerLink]="['/']" fragment="contact" class="bottom-nav-item">
        <div class="nav-icon-wrapper">
            <i class="fa-solid fa-envelope"></i>
        </div>
        <span>Hire</span>
    </a>
</nav>

<!-- Custom Cursor -->
<div class="custom-cursor" 
     [style.transform]="'translate3d(' + cursorPos.x + 'px,' + cursorPos.y + 'px, 0)'"
     [class.pointer]="isPointer"
     [class.hidden]="!isVisible">
</div>
<div class="cursor-follower" 
     [style.transform]="'translate3d(' + cursorPos.x + 'px,' + cursorPos.y + 'px, 0)'"
     [class.pointer]="isPointer"
     [class.hidden]="!isVisible">
</div>
