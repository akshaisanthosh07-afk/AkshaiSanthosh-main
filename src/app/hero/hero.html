<section id="hero" class="hero-section">
  <!-- Background photo + legibility shading -->
  <div class="hx-bg" aria-hidden="true">
    <img src="assets/bgi.webp" alt="" fetchpriority="high" />
  </div>
  <div class="hx-shade" aria-hidden="true"></div>

  <div class="hx-inner">
    <!-- Left: headline (sits on the dark navy side of the photo) -->
    <div class="hx-copy">
      <h3 class="greeting" [class.birthday-active]="isBirthdayPeriod" data-aos="fade-right" data-aos-delay="300">
        Hello, it's me
      </h3>
      <h1 class="hx-title" data-aos="fade-right" data-aos-delay="400">
        <span class="hx-title-line">Akshai</span>
        <span class="hx-title-line hx-title-accent">Santhosh</span>
      </h1>
      <p class="hx-desc" data-aos="fade-right" data-aos-delay="550">
        I craft intuitive user experiences and turn them into robust frontend
        architectures &mdash; blending thoughtful product design with seamless
        technical execution.
      </p>
      <div class="hx-actions" data-aos="fade-up" data-aos-delay="700">
        <a href="#works" class="hx-btn">View My Work <i class="fa-solid fa-arrow-right"></i></a>
        <div class="hx-socials">
          <a href="https://www.linkedin.com/in/akshai18819/" target="_blank" rel="noopener" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="https://github.com/akshaisanthosh07-afk" target="_blank" rel="noopener" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="https://wa.me/919074329566" target="_blank" rel="noopener" aria-label="WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- Right: stats (sits on the warm gold side of the photo) -->
    <div class="hx-side">
      <div class="hx-stats" data-aos="fade-left" data-aos-delay="850">
        <div class="hx-stat">
          <span class="hx-stat-num">30+</span>
          <span class="hx-stat-label">Projects Done</span>
        </div>
        <div class="hx-stat">
          <span class="hx-stat-num">3</span>
          <span class="hx-stat-label">Companies</span>
        </div>
        <div class="hx-stat">
          <span class="hx-stat-num">1+</span>
          <span class="hx-stat-label">Years of Experience</span>
        </div>
      </div>
    </div>
  </div>
</section>
