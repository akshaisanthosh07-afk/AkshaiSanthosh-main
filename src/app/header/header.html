<header class="navbar" [class.header-hidden]="isHeaderHidden" [class.navbar-scrolled]="isScrolled" [class.on-dark-bg]="isHomePage && !isScrolled">
    <div class="container nav-container">
        <a [routerLink]="['/']" fragment="hero" class="logo" (click)="closeMenu()">
            <img src="assets/ASlogo.png" alt="AS Logo" class="logo-img" />
        </a>
        
        <nav class="nav-links" [class.active]="isMenuOpen">
            <a [routerLink]="['/']" fragment="hero" (click)="closeMenu()">Home</a>
            <a [routerLink]="['/']" fragment="about" (click)="closeMenu()">About</a>
            <a [routerLink]="['/']" fragment="services" (click)="closeMenu()">Services</a>
            <a [routerLink]="['/']" fragment="works" (click)="closeMenu()">Works</a>
            <a [routerLink]="['/']" fragment="experience" (click)="closeMenu()">Experience</a>
            <a [routerLink]="['/']" fragment="skills" (click)="closeMenu()">Skills</a>
        </nav>

        <div class="nav-actions-wrapper">
            <div class="nav-actions" [class.active]="isMenuOpen">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme" (click)="toggleTheme()">
                    <i class="fa-solid fa-moon" id="theme-icon" [class.fa-sun]="isDarkTheme" [class.fa-moon]="!isDarkTheme"></i>
                </button>
                <a [routerLink]="['/']" fragment="contact" class="btn btn-primary hire-me-btn" (click)="closeMenu()">Hire me!</a>
                <a href="assets/resume/AKSHAI%20SANTHOSH%20UIUX_108.pdf" download="AKSHAI SANTHOSH UIUX_108.pdf" class="btn btn-outline" (click)="closeMenu()">
                    <i class="fa-solid fa-download" style="margin-right: 0.3rem;"></i> Resume
                </a>
            </div>
            
            <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
                <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
            </button>
        </div>


    </div>
</header>
